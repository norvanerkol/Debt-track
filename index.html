<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debt Track</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Debt Track">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Debt Track</h1>
    <div class="summary" id="summary"></div>
    <button id="lang-toggle" class="btn lang-toggle" type="button"></button>
  </header>

  <main>
    <section class="panel" id="people-panel">
      <div class="panel-header">
        <h2 data-i18n="people">People</h2>
        <button id="add-person-btn" class="btn primary" data-i18n="addPerson">+ Add Person</button>
      </div>
      <ul id="people-list" class="people-list"></ul>
    </section>

    <section class="panel" id="detail-panel">
      <div id="detail-empty" class="empty-state">
        <p data-i18n="selectPersonHint">Select a person to see their debt history, or add someone new.</p>
      </div>

      <div id="detail-content" class="hidden">
        <div class="panel-header">
          <h2 id="detail-name"></h2>
          <div class="detail-actions">
            <button id="rename-btn" class="btn" data-i18n="rename">Rename</button>
            <button id="delete-person-btn" class="btn danger" data-i18n="delete">Delete</button>
          </div>
        </div>

        <div class="balance-box" id="balance-box"></div>

        <div class="add-entry-form">
          <div class="form-row">
            <label>
              <input type="radio" name="entry-kind" value="debt" checked>
              <span data-i18n="newDebt">New debt</span>
            </label>
            <label>
              <input type="radio" name="entry-kind" value="payment">
              <span data-i18n="payment">Payment</span>
            </label>
          </div>
          <div class="form-row">
            <select id="entry-direction"></select>
            <input type="number" id="entry-amount" data-i18n-placeholder="amount" placeholder="Amount" min="0.01" step="0.01">
            <select id="entry-currency"></select>
          </div>
          <div class="form-row">
            <input type="text" id="entry-note" data-i18n-placeholder="noteOptional" placeholder="Note (optional)">
            <input type="date" id="entry-date">
          </div>
          <div class="form-row">
            <button id="add-entry-btn" class="btn primary" data-i18n="add">Add</button>
          </div>
        </div>

        <h3 data-i18n="history">History</h3>
        <table class="history-table">
          <thead>
            <tr>
              <th data-i18n="date">Date</th>
              <th data-i18n="description">Description</th>
              <th class="num" data-i18n="amount">Amount</th>
              <th class="num" data-i18n="balance">Balance</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="modal-title">Add Person</h3>
      <input type="text" id="modal-input" data-i18n-placeholder="name" placeholder="Name">
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn" data-i18n="cancel">Cancel</button>
        <button id="modal-ok-btn" class="btn primary" data-i18n="save">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
